<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x6a7076, 22, 62);
const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 200);
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
document.body.prepend(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xd7e4f2, 0x3a342c, 0.7));
const sun = new THREE.DirectionalLight(0xfff3dc, 1.35);
sun.position.set(18, 28, 12);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.near=2; sun.shadow.camera.far=90;
sun.shadow.camera.left=sun.shadow.camera.bottom=-40;
sun.shadow.camera.right=sun.shadow.camera.top=40;
sun.shadow.bias=-0.0006; sun.shadow.normalBias=0.04;
scene.add(sun);
const fill=new THREE.DirectionalLight(0x9bb7ff, 0.28);
fill.position.set(-16,10,-10); scene.add(fill);

function mat(c){ return new THREE.MeshStandardMaterial({ color:c, roughness:0.7, metalness:0.05 }); }

const _texCache={};
function makeTex(kind){
  if(_texCache[kind]) return _texCache[kind];
  const c=document.createElement('canvas'); c.width=c.height=256;
  const g=c.getContext('2d');
  if(kind==='grass'){
    g.fillStyle='#3d7a32'; g.fillRect(0,0,256,256);
    for(let i=0;i<900;i++){
      g.fillStyle=`rgb(${40+Math.random()*50|0},${90+Math.random()*80|0},${30+Math.random()*30|0})`;
      g.fillRect(Math.random()*256,Math.random()*256,2+Math.random()*3,2+Math.random()*4);
    }
  } else if(kind==='road'){
    g.fillStyle='#6a6864'; g.fillRect(0,0,256,256);
    for(let i=0;i<400;i++){ g.fillStyle=`rgba(0,0,0,${Math.random()*0.18})`; g.fillRect(Math.random()*256,Math.random()*256,3,3); }
    g.fillStyle='#d2c48a'; g.fillRect(124,0,8,256);
    g.setLineDash([18,14]); g.strokeStyle='#c4b882'; g.lineWidth=4;
  } else if(kind==='concrete'){
    g.fillStyle='#6c7074'; g.fillRect(0,0,256,256);
    for(let i=0;i<500;i++){ g.fillStyle=`rgba(255,255,255,${Math.random()*0.07})`; g.fillRect(Math.random()*256,Math.random()*256,4,3); }
    g.strokeStyle='#5a5e62'; g.lineWidth=2;
    for(let i=0;i<8;i++){ g.beginPath(); g.moveTo(0,i*32); g.lineTo(256,i*32); g.stroke(); g.beginPath(); g.moveTo(i*32,0); g.lineTo(i*32,256); g.stroke(); }
  } else if(kind==='brick'){
    g.fillStyle='#5a4032'; g.fillRect(0,0,256,256);
    for(let y=0;y<16;y++){
      for(let x=0;x<8;x++){
        const ox=(y%2)*16;
        g.fillStyle=`rgb(${90+Math.random()*40|0},${50+Math.random()*25|0},${35+Math.random()*20|0})`;
        g.fillRect(x*32+ox+1,y*16+1,30,14);
      }
    }
  } else if(kind==='metal'){
    g.fillStyle='#4a5056'; g.fillRect(0,0,256,256);
    for(let i=0;i<80;i++){ g.fillStyle=`rgba(255,255,255,${0.03+Math.random()*0.06})`; g.fillRect(0,Math.random()*256,256,2); }
  } else if(kind==='plate'){
    g.fillStyle='#6a7076'; g.fillRect(0,0,256,256);
    g.strokeStyle='#9aa0a6'; g.lineWidth=2;
    for(let y=0;y<16;y++){
      for(let x=0;x<16;x++){
        const ox=(y%2)*8;
        g.beginPath();
        g.moveTo(x*16+ox+8,y*16+2); g.lineTo(x*16+ox+14,y*16+8); g.lineTo(x*16+ox+8,y*16+14); g.lineTo(x*16+ox+2,y*16+8); g.closePath(); g.stroke();
      }
    }
  } else {
    g.fillStyle='#888'; g.fillRect(0,0,256,256);
  }
  const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.magFilter=THREE.LinearFilter;
  _texCache[kind]=t; return t;
}
function tmat(kind,repeat=4,color=0xffffff){
  const t=makeTex(kind).clone(); t.repeat.set(repeat,repeat); t.needsUpdate=true;
  return new THREE.MeshStandardMaterial({map:t,color,roughness:0.85,metalness:kind==='metal'?0.35:0.04});
}

function makeBar(w=0.9){
  const g=new THREE.Group();
  const bg=new THREE.Mesh(new THREE.PlaneGeometry(w,0.12), new THREE.MeshBasicMaterial({color:0x220000, depthTest:false}));
  const fill=new THREE.Mesh(new THREE.PlaneGeometry(w,0.10), new THREE.MeshBasicMaterial({color:0x3dcc4a, depthTest:false}));
  fill.position.z=0.01; g.add(bg); g.add(fill);
  g.userData.fill=fill; g.userData.w=w;
  return g;
}
function setBar(bar, ratio){
  const r=Math.max(0,Math.min(1,ratio));
  bar.userData.fill.scale.x=Math.max(0.001,r);
  bar.userData.fill.position.x=-(1-r)*bar.userData.w/2;
  bar.userData.fill.material.color.setHex(r>0.5?0x3dcc4a: r>0.25?0xe0b020:0xdd3030);
}

const world = new THREE.Group(); scene.add(world);
function add(mesh){ world.add(mesh); return mesh; }

function box(x,y,z,w,h,d,c,tex){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), tex?tmat(tex, Math.max(1,w/4)):mat(c));
  m.position.set(x,y,z); m.castShadow=true; m.receiveShadow=true;
  if(h>=1.2 && w>=0.8 && d>=0.8){
    solids.push({x,z,hx:w/2+0.45, hz:d/2+0.45});
  }
  return add(m);
}

function lamp(x,z){
  box(x,2.2,z, 0.18,4.4,0.18, 0x333);
  const bulb=new THREE.Mesh(new THREE.SphereGeometry(0.22,8,8), new THREE.MeshStandardMaterial({color:0xffe08a,emissive:0xffcc66,emissiveIntensity:1.1}));
  bulb.position.set(x,4.5,z); add(bulb);
  const pl=new THREE.PointLight(0xffd89a, 0.55, 18);
  pl.position.set(x,4.4,z); scene.add(pl); world.add(pl);
}
function crate(x,z){ box(x,0.45,z, 1.2,0.9,1.2, 0x8a5a28); }
function rubble(x,z){
  for(let i=0;i<5;i++) box(x+(Math.random()-0.5)*2,0.2+Math.random()*0.3,z+(Math.random()-0.5)*2, 0.6,0.35,0.5, 0x6a6660);
}
function buildLab(){
  scene.background = new THREE.Color(0x3a3e42);
  scene.fog.color.set(0x3a3e42);
  scene.fog.near = 18; scene.fog.far = 70;
  // huge floor
  const labFloor=new THREE.Mesh(new THREE.BoxGeometry(80,0.12,80), tmat('concrete',10));
  labFloor.position.set(0,0.02,0); labFloor.receiveShadow=true; add(labFloor);
  // tile lines
  for(let i=-4;i<=4;i++){
    box(i*8,0.08,0, 0.12,0.02,80, 0x4a4e52);
    box(0,0.08,i*8, 80,0.02,0.12, 0x4a4e52);
  }
  // outer walls
  box(0,4,-40, 80,8,0.6, 0x4e5358);
  box(0,4,40, 80,8,0.6, 0x4e5358);
  box(-40,4,0, 0.6,8,80, 0x4e5358);
  box(40,4,0, 0.6,8,80, 0x4e5358);
  box(0,8.2,0, 80,0.4,80, 0x32363a);
  // corridor walls
  box(-8,3.2,-12, 0.4,6.4,24, 0x555a60);
  box(8,3.2,-12, 0.4,6.4,24, 0x555a60);
  box(0,3.2,-24, 16.4,6.4,0.4, 0x555a60);
  // lab rooms
  box(-22,3.2,8, 16,6.4,0.4, 0x555a60);
  box(22,3.2,8, 16,6.4,0.4, 0x555a60);
  // ceiling lights
  for(let x=-24;x<=24;x+=12){
    for(let z=-24;z<=24;z+=12){
      box(x,7.7,z, 3.2,0.12,0.7, 0xd0d6dc);
    }
  }
  // tanks / tubes
  function tank(x,z,c){
    const t=new THREE.Mesh(new THREE.CylinderGeometry(1.1,1.1,3.2,12), mat(c));
    t.position.set(x,1.7,z); t.castShadow=true; world.add(t);
    box(x,0.2,z, 2.4,0.3,2.4, 0x3a3e42);
  }
  tank(-18,-6,0x2a6a78); tank(-14,-6,0x2a6a78); tank(-18,-2,0x3a5a48);
  tank(16,18,0x2a6a78); tank(20,18,0x4a3a48);
  // benches
  box(-20,0.85,16, 8,1.1,2.2, 0x4a4e54);
  box(-20,1.6,16, 7.4,0.12,1.8, 0x3a3e44);
    // loja de madeira
  box(18,1.4,-16, 6.4,2.8,4.2, 0x8a5a28);
  box(18,3.0,-16, 6.8,0.35,4.6, 0x6a4020);
  box(18,2.2,-13.8, 5.2,1.4,0.25, 0xc4a024);
  box(16.2,0.7,-14.2, 0.4,1.4,0.4, 0x5a3a18);
  box(19.8,0.7,-14.2, 0.4,1.4,0.4, 0x5a3a18);

  // server racks
  for(let i=0;i<5;i++) box(-30,1.6,-10+i*3.2, 1.6,3.2,1.4, 0x2e3236);
  // warning stripe
  box(0,0.09,8, 6,0.04,0.4, 0xc4a024);
  box(0,0.09,-8, 6,0.04,0.4, 0xc4a024);
  // doors marks
  box(0,1.6,-23.7, 2.2,3.2,0.2, 0x2a2e32);
  box(-7.7,1.6,0, 0.2,3.2,2.2, 0x2a2e32);
}

function buildCrossroads(){
  scene.background = new THREE.Color(0x87b4d8);

}

  if(experiment){

function paintShop(){
  const map={
    'buy-g':'guest','buy-lg':'lgGuest','buy-heli':'heli','buy-spider':'spider','buy-mech':'mech','buy-gmech':'gmech','buy-upg':'upg','buy-suit':'suit','buy-big':'giant'
  };
  Object.keys(map).forEach(id=>{
    const b=document.getElementById(id); if(!b) return;
    const k=map[id];
    b.style.outline = (skin===k||(k==='heli'&&skin==='heli')||(k==='mech'&&skin==='mech')||(k==='gmech'&&skin==='gmech')) && owned[k] ? '3px solid #3d3' : (owned[k]?'2px solid #888':'');
  });

function dumpSave(){
  return btoa(unescape(encodeURIComponent(JSON.stringify({bricks,owned,heliLv,mechLv,gmechLv,skin,v:1}))));
}
function loadSave(code){
  try{
    const d=JSON.parse(decodeURIComponent(escape(atob(code.trim()))));
    if(d.bricks!=null) bricks=d.bricks;
    if(d.owned) owned=Object.assign({noob:true},d.owned);
    if(d.heliLv!=null) heliLv=d.heliLv;
    if(d.mechLv!=null) mechLv=d.mechLv;
    if(d.gmechLv!=null) gmechLv=d.gmechLv;
    if(d.skin){ skin=d.skin; applySkin(skin==='heli2'?'heli':skin==='mech2'?'mech':skin); }
    paintShop();
    return true;
  }catch(e){ return false; }
}

function spawnExperiment(forceSuper, forceBaz, forceTitan, forceGiant){
  const spot=SPAWNS[Math.floor(Math.random()*SPAWNS.length)].clone();
  spot.x += (Math.random()-0.5)*2; spot.z += (Math.random()-0.5)*2;
  const titan = !!forceTitan;
  const superG = !!forceSuper && !titan;
  const baz = !!forceBaz && !titan;
  const giant = !!forceGiant || (!superG && !baz && !titan && wave>=3 && Math.random() < (wave===3?0.15: wave===4?0.22: wave===5?0.28:0.32));
  const mesh=robloxNoob({giant, superGiant:superG||titan, experiment:true, titan});
  if (baz){
    const tube=new THREE.Mesh(new THREE.CylinderGeometry(0.12,0.16,1.15,8), mat(0x4a4e42));
    tube.rotation.z=Math.PI/2; tube.position.set(0.55,1.35,0.2);
    const nose=new THREE.Mesh(new THREE.ConeGeometry(0.16,0.28,8), mat(0x8a3a20));
    nose.rotation.z=-Math.PI/2; nose.position.set(1.2,1.35,0.2);
    mesh.add(tube); mesh.add(nose);
  }
  mesh.position.copy(spot);
  const hpE = titan?1000: superG?420: giant?175:75;
  enemies.push({ mesh, hp: hpE, maxHp: hpE, spd: titan?1.35: superG?1.7: baz?2.6: giant?2.2:3.3, dmg: titan?70: superG?55: giant?35:20, cd:0, anim:Math.random()*8, superG, baz, titan, rocketCd: 1.5 });

function attachRockets(mesh, n, sc){
  for(let i=0;i<n;i++){
    const g=new THREE.Group();
    const tube=new THREE.Mesh(new THREE.CylinderGeometry(0.22*sc,0.26*sc,1.6*sc,10), mat(0x2a2a2a));
    const fin=new THREE.Mesh(new THREE.BoxGeometry(0.12*sc,0.45*sc,0.55*sc), mat(0xff7a18));
    fin.position.y=-0.5*sc;
    const nose=new THREE.Mesh(new THREE.ConeGeometry(0.26*sc,0.45*sc,8), mat(0xff7a18));
    nose.position.y=1.0*sc;
    const fire=new THREE.Mesh(new THREE.ConeGeometry(0.16*sc,0.5*sc,8), new THREE.MeshStandardMaterial({color:0xffaa22,emissive:0xff5500,emissiveIntensity:1}));
    fire.rotation.x=Math.PI; fire.position.y=-0.95*sc;
    g.add(tube,fin,nose,fire);
    g.position.set((i-(n-1)/2)*0.7*sc, 1.55*sc, -0.55*sc);
    mesh.add(g);
  }
}
function spawnKind(kind){
  if(kind==='norm') return spawnExperiment(false,false,false,false);
  if(kind==='super') return spawnExperiment(true,false,false,false);
  if(kind==='baz') return spawnExperiment(false,true,false,false);
  if(kind==='titan') return spawnExperiment(false,false,true,false);
  if(kind==='giant') return spawnExperiment(false,false,false,true);
  const spot=SPAWNS[Math.floor(Math.random()*SPAWNS.length)].clone();
  spot.x+=(Math.random()-0.5)*2; spot.z+=(Math.random()-0.5)*2;
  if(kind==='boss'){
    const mesh=robloxNoob({giant:true, experiment:true});
    mesh.scale.set(4.3,4.3,4.3);
    mesh.traverse(o=>{
      if(!o.isMesh||!o.material||!o.material.color) return;
      if(o.material.color.getHex()===0x4b974b) o.material=mat(0x6a7278);
    });
    if(mesh.userData.legL) mesh.userData.legL.material=mat(0x6a7278);
    if(mesh.userData.legR) mesh.userData.legR.material=mat(0x6a7278);
    // some a ponta da mao direita (serra no lugar)
    if(mesh.userData.armR){
      mesh.userData.armR.scale.y=0.62;
      mesh.userData.armR.position.y += 0.12;
    }
    const dark=mat(0x222);
    const neon=new THREE.MeshStandardMaterial({color:0xff7a18,emissive:0xff4400,emissiveIntensity:0.8});
    // jetpack
    const pack=new THREE.Mesh(new THREE.BoxGeometry(0.85,1.15,0.45), dark);
    pack.position.set(0,1.25,-0.55); mesh.add(pack);
    const jL=new THREE.Mesh(new THREE.CylinderGeometry(0.18,0.22,0.7,8), dark);
    jL.position.set(-0.28,0.7,-0.55); mesh.add(jL);
    const jR=jL.clone(); jR.position.x=0.28; mesh.add(jR);
    const flame=new THREE.Mesh(new THREE.ConeGeometry(0.16,0.45,8), neon);
    flame.rotation.x=Math.PI; flame.position.set(-0.28,0.28,-0.55); mesh.add(flame);
    const flame2=flame.clone(); flame2.position.x=0.28; mesh.add(flame2);
    // lasers nas costas
    function laser(x){
      const t=new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.13,1.25,8), dark);
      t.rotation.x=Math.PI/2; t.position.set(x,2.62,0.55); mesh.add(t);
      const tip=new THREE.Mesh(new THREE.CylinderGeometry(0.09,0.09,0.22,8), neon);
      tip.rotation.x=Math.PI/2; tip.position.set(x,2.62,1.2); mesh.add(tip);
    }
    laser(-0.95); laser(0.95);
    // serra no braco
    const saw=new THREE.Mesh(new THREE.CylinderGeometry(0.95,0.95,0.16,20), mat(0x9aa0a6));
    saw.rotation.z=Math.PI/2;
    const teeth=new THREE.Mesh(new THREE.TorusGeometry(0.95,0.08,8,20), mat(0xc8cdd2));
    teeth.rotation.y=Math.PI/2;
    const hub=new THREE.Mesh(new THREE.CylinderGeometry(0.16,0.16,0.2,10), mat(0x333));
    hub.rotation.z=Math.PI/2;
    const sawG=new THREE.Group(); sawG.add(saw,teeth,hub);
    for(let i=0;i<12;i++){
      const sp=new THREE.Mesh(new THREE.ConeGeometry(0.09,0.28,5), mat(0xddd));
      const a=i/12*Math.PI*2;
      sp.position.set(0, Math.cos(a)*1.05, Math.sin(a)*1.05);
      sp.rotation.x=a;
      sawG.add(sp);
    }
    sawG.position.set(0.28,-0.58,0);
    mesh.userData.armR.add(sawG);
    mesh.userData.saw=sawG;
    mesh.position.copy(spot);
    enemies.push({mesh,hp:14500,maxHp:14500,spd:1.15,dmg:500,cd:0,anim:0,boss:true,baz:true,rocketCd:3.5});
    return;
  }
  const titan=kind==='tR', giant=kind==='g2r', rocketsN=kind==='g2r'?2:1;
  const mesh=robloxNoob({giant:giant||titan, superGiant:titan, experiment:true, titan:titan});
  attachRockets(mesh, rocketsN, titan?1.4: giant?1.1:1);
  mesh.position.copy(spot);
  const hpE=titan?1600: giant?320: 95;
  enemies.push({mesh,hp:hpE,maxHp:hpE,spd:titan?1.4:giant?2.0:3.0,dmg:titan?85:giant?42:24,cd:0,anim:0,baz:true,rocketCd:2.5+Math.random(),rocketsN});
}

let peer=null, mpHost=false, mpCons=[], remotes={};
function mpSend(obj){
  const msg=JSON.stringify(obj);
  mpCons.forEach(c=>{ try{ if(c.open) c.send(msg); }catch(e){} });
}
function addRemote(id){
  if(remotes[id]) return remotes[id];
  const g=robloxNoob({});
  g.traverse(o=>{ if(o.isMesh && o.material && o.material.color && o.material.color.getHex()===0x0b66d6) o.material=mat(0xff55aa); });
  remotes[id]={mesh:g, last:0};
  return remotes[id];
}
function hookConn(c){
  mpCons.push(c);
  c.on('data', raw=>{
    let d; try{ d=JSON.parse(raw); }catch(e){ return; }
    if(d.t==='st'){
      const r=addRemote(c.peer);
      r.mesh.position.set(d.x,d.y,d.z);
      r.mesh.rotation.y=d.ry;
      r.last=performance.now();
    }
  });
  c.on('close', ()=>{
    mpCons=mpCons.filter(x=>x!==c);
    if(remotes[c.peer]){ scene.remove(remotes[c.peer].mesh); delete remotes[c.peer]; }
  });
}
function joinSala(n){
  const rid='ne3d-sala-'+n;
  document.getElementById('svs').style.display='none';
  document.getElementById('wave').textContent='CONECTANDO SALA '+n+'...';
  if(peer){ try{ peer.destroy(); }catch(e){} }
  peer=new Peer(rid, {debug:0});
  mpHost=true;
  peer.on('open', id=>{
    document.getElementById('wave').textContent='SALA '+n+' (host)';
  });
  peer.on('error', err=>{
    if(String(err).includes('unavailable') || err.type==='unavailable-id'){
      mpHost=false;
      peer=new Peer({debug:0});
      peer.on('open', ()=>{
        const c=peer.connect(rid, {reliable:true});
        c.on('open', ()=>{ hookConn(c); document.getElementById('wave').textContent='SALA '+n+' (entrou)'; });
      });
      peer.on('error', e2=>{ document.getElementById('wave').textContent='MP ERRO '+e2.type; });
    } else document.getElementById('wave').textContent='MP '+err.type;
  });
  peer.on('connection', c=>{
    c.on('open', ()=> hookConn(c));
  });
}

    for (const w of walls){
      const dx=player.position.x-w.x, dz=player.position.z-w.z;
      const px=Math.max(-w.w/2, Math.min(w.w/2, dx));
      const pz=Math.max(-w.d/2, Math.min(w.d/2, dz));
      const cx=w.x+px, cz=w.z+pz;
      const ox=player.position.x-cx, oz=player.position.z-cz;
      const dist=Math.hypot(ox,oz);
      if (dist<r && dist>0){
        player.position.x += ox/dist*(r-dist);
        player.position.z += oz/dist*(r-dist);
      }
    }
  }
  const w=moving?Math.sin(now*0.016)*0.45:0;
  if(skin==='spider' && player.userData.slegs){
      player.userData.slegs.forEach((lg,i)=>{ lg.rotation.x = moving ? Math.sin(now*0.014 + i)*0.5 : 0; });
    } else {
      player.userData.legL.rotation.x=w; player.userData.legR.rotation.x=-w;
    }
  for(let i=fx.length-1;i>=0;i--){
    const p=fx[i]; p.t-=dt; p.vel.y-=p.g*dt;
    p.mesh.position.addScaledVector(p.vel,dt);
    p.mesh.material.opacity=Math.max(0,p.t*2);
    p.mesh.rotation.x+=dt*6; p.mesh.rotation.y+=dt*4;
    if(p.t<=0){ scene.remove(p.mesh); fx.splice(i,1); }
  }
  shieldCd=Math.max(0,shieldCd-dt);
  if(shieldT>0){ shieldT-=dt; if(shieldT<=0 && shieldMesh){ player.remove(shieldMesh); shieldMesh=null; } }
  pisCd=Math.max(0,pisCd-dt);
  if(laserT>0){
    laserT-=dt;
    const fwd=new THREE.Vector3(Math.sin(player.rotation.y),0,Math.cos(player.rotation.y));
    if(laserBeams.length===0){
      for(let i=0;i<2;i++){
        const b=new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.14,14,8), new THREE.MeshStandardMaterial({color:0x22eeff,emissive:0x00ddff,emissiveIntensity:2,transparent:true,opacity:0.9}));
        scene.add(b); laserBeams.push(b);
      }
    }
    const cans=player.userData.cannons||[{x:-3,y:9},{x:3,y:9}];
    const right=new THREE.Vector3(Math.cos(player.rotation.y),0,-Math.sin(player.rotation.y));
    laserBeams.forEach((b,i)=>{
      const c=cans[i];
      b.position.copy(player.position);
      b.position.y += c.y;
      b.position.addScaledVector(right, c.x);
      b.position.addScaledVector(fwd, 7);
      b.lookAt(b.position.clone().add(fwd.clone().multiplyScalar(10)));
      b.rotateX(Math.PI/2);
    });
    laserAcc+=dt; if(laserAcc>=0.1){ laserAcc=0, shieldT=0, shieldCd=0, shieldMesh=null;
      for(const e of enemies){
        const to=e.mesh.position.clone().sub(player.position); to.y=0;
        const dir=new THREE.Vector3(Math.sin(player.rotation.y),0,Math.cos(player.rotation.y));
        if(to.length()<16 && to.normalize().dot(dir)>0.85){ e.hp-=(mechLv>=2?25:20); e.hitT=0.12; }
      }
    }
    if(laserT<=0 && laserBeams.length){ laserBeams.forEach(b=>scene.remove(b)); laserBeams=[]; }
  }
  metCd=Math.max(0,metCd-dt); misCd=Math.max(0,misCd-dt); trpCd=Math.max(0,trpCd-dt);
  if(skin==='heli'){ tropaAcc+=dt; const need=heliLv>=2?15:heliLv>=1?20:30; if(tropaAcc>=need){ tropaAcc=0; tropaStock++; } }
  if(skin==='heli' && player.userData.rotor) player.userData.rotor.rotation.y += dt*18;
  if(skin==='heli'){
    if(onGround) player.position.y = Math.max(player.position.y, 3.2);
    onGround=false;
  }
  for(let i=allies.length-1;i>=0;i--){
    const a=allies[i];
    let tgt=null, best=99;
    for(const e of enemies){ if(e.hp<=0) continue; const d=a.mesh.position.distanceTo(e.mesh.position); if(d<best){best=d;tgt=e;} }
    if(tgt){
      const dx=tgt.mesh.position.x-a.mesh.position.x, dz=tgt.mesh.position.z-a.mesh.position.z;
      const d=Math.hypot(dx,dz)||1;
      a.mesh.position.x += dx/d*5.5*dt; a.mesh.position.z += dz/d*5.5*dt;
      a.mesh.rotation.y=Math.atan2(dx,dz);
      a.cd-=dt;
      if(d<1.6 && a.cd<=0){ tgt.hp-=a.dmg; a.cd=0.45; tgt.hitT=0.2; }
    }
    a.life-=dt; if(a.life<=0){ scene.remove(a.mesh); allies.splice(i,1); }
  }
  soundCd=Math.max(0,soundCd-dt);
  for(let i=soundWaves.length-1;i>=0;i--){
    const w=soundWaves[i]; w.t-=dt; w.mesh.scale.x+=8*dt; w.mesh.scale.y+=8*dt;
    w.mesh.material.opacity=Math.max(0,w.t/0.7);
    if(w.t<=0){ scene.remove(w.mesh); soundWaves.splice(i,1); }
  }
  if(blastSeq && skin==='spider'){
    const k = Math.sin((4.2-(blastSeq.wait||0))*8)*0.08;
    player.rotation.x = -0.12 + k;
  }
  if(blastSeq){
    blastT=1;
    if(player.userData.armL){
      const recL = armKick.l>0 ? 0.35 : 0;
      const recR = armKick.r>0 ? 0.35 : 0;
      player.userData.armL.rotation.x = -1.55 + recL;
      player.userData.armR.rotation.x = -1.55 + recR;
    }
    armKick.l=Math.max(0,armKick.l-dt);
    armKick.r=Math.max(0,armKick.r-dt);
    blastSeq.wait -= dt;
    if(blastSeq && blastSeq.gbl && blastSeq.wait<=0 && blastSeq.n<6){
        const fwd=new THREE.Vector3(Math.sin(player.rotation.y),0.05,Math.cos(player.rotation.y)).normalize();
        const right=new THREE.Vector3(Math.cos(player.rotation.y),0,-Math.sin(player.rotation.y));
        const side=blastSeq.n%2===0?-1:1;
        const m=new THREE.Mesh(new THREE.SphereGeometry(0.35,12,12), new THREE.MeshStandardMaterial({color:0xff4466,emissive:0xff2244,emissiveIntensity:1.3}));
        m.position.copy(player.position); m.position.y+=6;
        m.position.addScaledVector(right, side*3.2); m.position.addScaledVector(fwd,2);
        scene.add(m); playerShots.push({mesh:m,dir:fwd.clone(),life:2.4,dmg:750});
        blastSeq.n++; blastSeq.wait=blastSeq.n>=6?0:1;
        if(blastSeq.n>=6){ blastSeq=null; blastT=0; }
      } else if(blastSeq && blastSeq.wait<=0 && blastSeq.n<4 && !blastSeq.mech && !blastSeq.gbl){
      const side = blastSeq.n%2===0 ? -1 : 1;
      if(side<0) armKick.l=0.28; else armKick.r=0.28;
      const fwd=new THREE.Vector3(Math.sin(player.rotation.y),0.08,Math.cos(player.rotation.y)).normalize();
      const right=new THREE.Vector3(Math.cos(player.rotation.y),0,-Math.sin(player.rotation.y));
      const h=2.4*((player.scale&&player.scale.y)||1);
      const m=new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.14,0.5,8), mat(0xff7a18));
      m.rotation.z=Math.PI/2;
      m.position.copy(player.position);
      m.position.addScaledVector(fwd, 1.3);
      m.position.addScaledVector(right, side*0.85);
      m.position.y += h;
      scene.add(m);
      spawnFx(m.position.clone(), skin==='spider'?0xfff36a:0xff7a18, 6, 3, 0.2, 0.1, 2);
      const isSp=skin==='spider';
      m.geometry.dispose();
      m.geometry= isSp ? new THREE.SphereGeometry(0.28,10,8) : new THREE.CylinderGeometry(0.1,0.14,0.5,8);
      if(isSp){ m.material=new THREE.MeshStandardMaterial({color:0xfff020,emissive:0xffee00,emissiveIntensity:1.4}); m.rotation.set(0,0,0); }
      playerShots.push({mesh:m, dir:fwd.clone(), life:2.2, dmg: isSp?185:150});
      blastSeq.n++;
      blastSeq.wait = blastSeq.n>=4 ? 0 : 1;
    }
    if(blastSeq && blastSeq.mech && blastSeq.wait<=0 && blastSeq.n<4){
        const fwd=new THREE.Vector3(Math.sin(player.rotation.y),0.05,Math.cos(player.rotation.y)).normalize();
        const right=new THREE.Vector3(Math.cos(player.rotation.y),0,-Math.sin(player.rotation.y));
        const h=7.5;
        for(const side of [-0.9,0.9]){
          const m=new THREE.Mesh(new THREE.SphereGeometry(0.22,8,8), new THREE.MeshStandardMaterial({color:0x66ddff,emissive:0x2288ff,emissiveIntensity:1.2}));
          m.position.copy(player.position);
          m.position.addScaledVector(fwd, 2.2);
          m.position.addScaledVector(right, side);
          m.position.y += h;
          scene.add(m);
          playerShots.push({mesh:m, dir:fwd.clone(), life:2.2, dmg: mechLv>=1?481:406});
        }
        blastSeq.n++;
        blastSeq.wait = blastSeq.n>=4 ? 0 : 0.18;
        if(blastSeq.n>=4){ blastSeq=null; blastT=0; }
      } else if(blastSeq && blastSeq.n>=4 && blastSeq.wait<=0 && armKick.l<=0 && armKick.r<=0){
      blastSeq=null; blastT=0;
    }
  } else if(punchT>0){
    punchT-=dt;
    const p = 1 - punchT/0.42;
    // vento + soco + recuo
    if (p<0.35){
      player.userData.armR.rotation.x = -1.4;
      player.userData.armL.rotation.x = 0.5;
      player.rotation.x = -0.12;
    } else if (p<0.7){
      player.userData.armR.rotation.x = 1.55;
      player.userData.armL.rotation.x = -0.4;
      player.rotation.x = 0.18;
    } else {
      player.userData.armR.rotation.x = 0.3;
      player.rotation.x *= 0.7;
    }
    if(punchT<=0){ punching=false; player.rotation.x=0; }
  } else {
    player.userData.armL.rotation.x=-w*0.8;
    player.userData.armR.rotation.x=w*0.8;
    player.rotation.x=0;
  }

  if (mode==='lab'){
    const td = Math.hypot(player.position.x+22, player.position.z-16);
    const talk=document.getElementById('talk');
    if (td<3.4){
      talk.style.display='block';
      talk.innerHTML='VOCÊ: OLÁ, ESTÁ TUDO BEM? MAS VAMOS AO PONTO, QUANDO QUE O TITAN NOOB ESTARÁ PRONTO?<br><br>NOOB GRANDE INJURADO: EU NÃO SEI, PERGUNTE PARA O CIENTISTA, MAS ELE ESTÁ OCUPADO AGORA…';
    } else talk.style.display='none';
    const sd = Math.hypot(player.position.x-18, player.position.z+16);
    const shopEl=document.getElementById('shop');
    if (sd<4.2){ shopEl.style.display='flex'; shopOpen=true; const sb=document.getElementById('shopbr'); if(sb) sb.textContent='TIJOLOS '+bricks; }
    else if(shopOpen){ shopOpen=false; shopEl.style.display='none'; }
  }
  if(paused){ }
  else if(mode==='fight' && !over){ try {
    spawnAcc+=dt;
    if(toSpawn>0 && spawnAcc>0.85){ spawnAcc=0; toSpawn--;
      if(gameMode==='normal'){
        const w=wave, pool=[];
        if(w>=4 && w<=20) pool.push('expR');
        if(w>=6 && w<=15) pool.push('g2r');
        if(w>=15 && w<=25) pool.push('tR');
        if(w<4) pool.push('norm');
        if(!pool.length) pool.push('norm');
        spawnKind(pool[Math.floor(Math.random()*pool.length)]);
      } else spawnExperiment();
    }
    for(const e of enemies){
      if(e.hp<=0){ e.mesh.visible=false; continue; }
      e.anim+=dt*8;
      if(e.mesh.userData.key) e.mesh.userData.key.rotation.z=now*0.004;
      if(e.mesh.userData.saw) e.mesh.userData.saw.rotation.x=now*0.012;
      const dx=player.position.x-e.mesh.position.x;
      const dz=player.position.z-e.mesh.position.z;
      const dist=Math.hypot(dx,dz)||1;
      if(e.mesh.userData.bar){ e.mesh.userData.bar.lookAt(camera.position); setBar(e.mesh.userData.bar, e.hp/e.maxHp); }
      if (e.hitT){ e.hitT-=dt; e.mesh.position.x += Math.sin(e.mesh.rotation.y)*-0.04; e.mesh.position.z += Math.cos(e.mesh.rotation.y)*-0.04; }
      else { e.mesh.rotation.x=0; e.mesh.rotation.z=0; }
      if (e.baz){
        e.rocketCd -= dt;
        if (e.rocketCd<=0 && dist>2.2){
          e.rocketCd=7;
          const rocket=new THREE.Mesh(new THREE.CylinderGeometry(0.08,0.1,0.55,6), mat(0x5a3a20));
          rocket.rotation.z=Math.PI/2;
          rocket.position.copy(e.mesh.position); rocket.position.y=1.35;
          scene.add(rocket);
          rockets.push({mesh:rocket, life:3});
        }
      }
      if(dist>1.7){
        e.mesh.position.x += dx/dist*e.spd*dt;
        e.mesh.position.z += dz/dist*e.spd*dt;
        e.mesh.rotation.y=Math.atan2(dx,dz);
        const ww=Math.sin(e.anim)*0.55;
        e.mesh.userData.legL.rotation.x=ww; e.mesh.userData.legR.rotation.x=-ww;
        e.mesh.userData.armL.rotation.x=-ww*0.9; e.mesh.userData.armR.rotation.x=ww*0.9;
      } else {
        e.cd-=dt;
        const swing = Math.sin((0.9-Math.max(0,e.cd))*8);
        e.mesh.userData.armR.rotation.x = e.cd>0.45 ? -1.3 : 1.4;
        e.mesh.userData.armL.rotation.x = -0.4;
        e.mesh.userData.legL.rotation.x = 0.3;
        e.mesh.position.x += dx/dist*1.2*dt;
        e.mesh.position.z += dz/dist*1.2*dt;
        if(e.cd<=0){ hp-= Math.floor(e.dmg*(shieldT>0?0.25:1)); e.cd=0.95; }
      }
      if(punching && dist<2.4 && punchT>0.18 && punchT<0.32){
        if(!e.gotHit){
          e.hp-=atkDmg; e.gotHit=true; e.hitT=0.25;
          e.mesh.position.x -= dx/dist*1.1;
          e.mesh.position.z -= dz/dist*1.1;
          if(e.hp<=0){ e.mesh.visible=false; const gain=e.boss?80:e.titan?95:e.dmg>=500?80:e.dmg>=35?9:6; bricks+=gain; streak++; floaters.push({t:1.4,text:'+'+gain+' tijolos  STREAK '+streak,y:20}); }
        }
      } else if(!punching) e.gotHit=false;
    }
    if(toSpawn<=0 && enemies.every(e=>e.hp<=0||!e.mesh.visible)){
      if(rest<=0) rest=5;
      rest-=dt;
      waveEl.textContent = rest>0 ? ('PROXIMA ONDA '+Math.ceil(Math.max(0,rest))) : ('ONDA '+wave);
      if(rest<=0){ rest=0; nextWave(); }
    }
    for (let i=playerShots.length-1;i>=0;i--){
      const sh=playerShots[i]; sh.life-=dt;
      sh.mesh.position.addScaledVector(sh.dir, 22*dt);
      let hit=false;
      for(const e of enemies){
        if(e.hp<=0) continue;
        if(sh.mesh.position.distanceTo(e.mesh.position)<1.6+(e.titan?2:0)){
          e.hp-=sh.dmg; hit=true; e.hitT=0.2;
          if(e.hp<=0){ e.mesh.visible=false; const gain=e.boss?80:e.titan?95:e.dmg>=500?80:e.dmg>=35?9:6; bricks+=gain; streak++; }
          break;
        }
      }
      if(hit||sh.life<=0){ scene.remove(sh.mesh); playerShots.splice(i,1); }
    }
    for (let i=rockets.length-1;i>=0;i--){
      const rk=rockets[i];
      rk.life-=dt;
      const rdx=player.position.x-rk.mesh.position.x;
      const rdz=player.position.z-rk.mesh.position.z;
      const rd=Math.hypot(rdx,rdz)||1;
      rk.mesh.position.x += rdx/rd*18*dt;
      rk.mesh.position.z += rdz/rd*18*dt;
      rk.mesh.position.y = 1.3;
      if (rd<1.1){ hp-=28; scene.remove(rk.mesh); rockets.splice(i,1); }
      else if(rk.life<=0){ scene.remove(rk.mesh); rockets.splice(i,1); }
    }
    if(hp<=0 && !over){
      over=true; deathT=3.2;
      player.visible=false;
      spawnFx(player.position.clone().setY(1.2), 0xf5cd30, 28, 9, 0.8, 0.2, 12);
      spawnFx(player.position.clone().setY(1.4), 0xff7a18, 18, 8, 0.7, 0.16, 10);
      msg.style.display='block';
      msg.textContent='OS EXPERIMENTOS TE PEGARAM';
    }
    hud.innerHTML='HP '+Math.max(0,Math.ceil(hp))+'/'+maxHp+'<br>TIJOLOS '+bricks;
  } catch(err){ document.getElementById('wave').textContent=String(err&&err.message||err); }
  }
  if(over && deathT>0){
    deathT-=dt;
    msg.style.display='block';
    msg.innerHTML='OS EXPERIMENTOS TE PEGARAM<br>voltando em '+Math.ceil(Math.max(0,deathT));
    if(deathT<=0){ deathT=0; msg.style.display='none'; player.visible=true; goLobby(); }
  }
  const sc = (player.scale && player.scale.y) ? player.scale.y : 1;
  const body = (skin==='gmech') ? 3.0 : (skin==='mech') ? 3.2 : (skin==='spider') ? 2.2 : (skin==='upg'||skin==='giant'||isGiantNoob||skin==='lgGuest') ? 1.7 : 1;
  const dist = 7.2 + 5.5*sc*body;
  const height = 3.2 + 1.6*sc*body;
  _cam.set(
    player.position.x - Math.sin(yaw)*Math.cos(pitch)*dist,
    player.position.y + height + Math.sin(pitch)*dist,
    player.position.z - Math.cos(yaw)*Math.cos(pitch)*dist
  );
  camera.position.lerp(_cam, 1-Math.pow(0.0008,dt));
  camera.lookAt(player.position.x, player.position.y+1.4*sc*body, player.position.z);
  mpAcc+=dt;
  if(peer && mpAcc>0.1){
    mpAcc=0;
    mpSend({t:'st', x:player.position.x, y:player.position.y, z:player.position.z, ry:player.rotation.y});
  }
  renderer.render(scene, camera);
  const ctx=renderer.getContext('2d');
  // overlay texts via DOM wave already; floaters on waveEl flash
  for(let i=floaters.length-1;i>=0;i--){
    floaters[i].t-=dt; floaters[i].y+=20*dt;
    if(floaters[i].t<=0) floaters.splice(i,1);
  }
  if(floaters.length && mode==='fight' && !over){
    const f=floaters[floaters.length-1];
    if(f.text && !f.text.startsWith('ONDA')) waveEl.textContent=f.text;
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
addEventListener('resize', ()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
